<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My&U</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 1.5s ease;
        }

        .logo {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            display: block;
            animation: pulse 1.5s ease infinite;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #000;
            position: relative;
            display: inline-block;
        }

        .brand-name::after {
            content: '|';
            animation: blink 0.8s step-end infinite;
            margin-right: 5px;
            color: #000;
        }

        .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 40px;
            background: #000;
            animation: blink 0.8s step-end infinite;
            vertical-align: middle;
            margin-right: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin: 30px auto 0;
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: #000;
            border-radius: 2px;
            animation: load 2s ease forwards;
        }

        @keyframes load {
            from { width: 0%; }
            to { width: 100%; }
        }

        .sub-text {
            color: #888;
            font-size: 0.9rem;
            margin-top: 15px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="splash-container">
    <img src="image_4.png" alt="My&U" class="logo" onerror="this.style.display='none'">
    
    <div class="brand-name" id="brandText"></div>
    
    <div class="loading-bar">
        <div class="loading-progress"></div>
    </div>
    
    <div class="sub-text">أفضل تشكيلة صيفية للأطفال</div>
</div>

<script>
    // تأثير الكتابة اليدوية
    const text = "انا و انت معآ ❤";
    let index = 0;
    const brandElement = document.getElementById('brandText');

    function typeWriter() {
        if (index < text.length) {
            brandElement.innerHTML = text.substring(0, index + 1) + '<span class="cursor-blink"></span>';
            index++;
            setTimeout(typeWriter, 150);
        } else {
            brandElement.innerHTML = text + '<span class="cursor-blink" style="animation: blink 0.8s step-end infinite;"></span>';
        }
    }

    // بدء التأثير
    setTimeout(typeWriter, 300);

    // الانتقال للصفحة الرئيسية بعد 2.5 ثانية
    setTimeout(() => {
        window.location.href = 'splash.html';
    }, 2500);
</script>

</body>
</html>
